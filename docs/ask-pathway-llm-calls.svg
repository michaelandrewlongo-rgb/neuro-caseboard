<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1190" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7bf"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0a93b"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <style>
      .lbl{fill:#e8eef9}
      .mut{fill:#93a0b8}
      .node{fill:#161d31;stroke:#2b3650;stroke-width:1.4}
      .nodeT{fill:#e8eef9;font-size:13px;text-anchor:middle}
      .nodeS{fill:#93a0b8;font-size:11px;text-anchor:middle}
      .llm{fill:#f6b73c;stroke:#b9831a;stroke-width:1.6}
      .llmT{fill:#1a1205;font-weight:700;text-anchor:middle}
      .llmS{fill:#3d2c08;text-anchor:middle}
      .model{fill:#0f3331;stroke:#2dd4bf;stroke-width:1.4}
      .modelT{fill:#cdeee9;font-size:13px;text-anchor:middle}
      .det{fill:#1c2436;stroke:#5a6b8c;stroke-width:1.3;stroke-dasharray:5 4}
      .store{fill:#20283d;stroke:#46557a}
      .edge{stroke:#9aa7bf;stroke-width:1.6;fill:none}
      .edgeAmber{stroke:#f0a93b;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
      .edgeTeal{stroke:#34d399;stroke-width:1.8;fill:none}
      .edgeTealD{stroke:#34d399;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
      .edgeRed{stroke:#ff6b6b;stroke-width:1.8;fill:none}
      .elabel{font-size:11px;font-weight:600}
      .sec{fill:#93a0b8;font-size:12px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1190" fill="#0b1020"/>

  <!-- Title -->
  <text x="40" y="46" class="lbl" font-size="26" font-weight="700">Neuro&#183;Caseboard &#8212; Ask pathway: data flow &amp; every LLM call</text>
  <text x="40" y="72" class="mut" font-size="13.5">Default woven mode (LITERATURE_WEAVE). <tspan fill="#f6b73c" font-weight="700">&#9312; &#9313; &#9314; = generative LLM calls</tspan>. Traced against a live run (cavernous-sinus / jugular-foramen).</text>

  <!-- ===== Spine: surfaces -> API -> qa ===== -->
  <g>
    <rect class="node" x="40" y="100" width="250" height="46" rx="8"/>
    <text class="nodeT" x="165" y="121">React SPA (web/)</text>
    <text class="nodeS" x="165" y="137">Browser / Phone</text>

    <rect class="node" x="330" y="100" width="300" height="46" rx="8"/>
    <text class="nodeT" x="480" y="121">FastAPI &#183; POST /api/ask</text>
    <text class="nodeS" x="480" y="137">api/server.py</text>

    <rect class="node" x="670" y="100" width="300" height="46" rx="8"/>
    <text class="nodeT" x="820" y="121">qa.answer_question</text>
    <text class="nodeS" x="820" y="137">woven path (default)</text>

    <line class="edge" x1="290" y1="123" x2="328" y2="123" marker-end="url(#arrow)"/>
    <line class="edge" x1="630" y1="123" x2="668" y2="123" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Disambiguation gate + LLM 1 ===== -->
  <g>
    <rect class="node" x="40" y="196" width="300" height="46" rx="8"/>
    <text class="nodeT" x="190" y="217">plan_retrieval &#8594; Engine._plan_query</text>
    <text class="nodeS" x="190" y="233">neuro_core.query</text>

    <rect class="det" x="380" y="196" width="270" height="46" rx="8"/>
    <text class="nodeT" x="515" y="216">ambiguity_gate</text>
    <text class="nodeS" x="515" y="232">deterministic &#8212; no LLM (scores candidates)</text>

    <rect class="llm" x="690" y="184" width="380" height="72" rx="10"/>
    <text class="llmT" x="880" y="206" font-size="14">&#9312;  LLM &#8212; DISAMBIGUATION  (conditional)</text>
    <text class="llmS" x="880" y="226" font-size="12.5" font-weight="600">gemini-3.1-flash-lite &#183; OpenRouter &#183; text</text>
    <text class="llmS" x="880" y="244" font-size="11.5">query_analyze &#8212; fires only when the gate trips</text>

    <line class="edge" x1="820" y1="146" x2="190" y2="194" marker-end="url(#arrow)"/>
    <line class="edge" x1="340" y1="219" x2="378" y2="219" marker-end="url(#arrow)"/>
    <path class="edgeAmber" d="M650,219 H672" marker-end="url(#arrowAmber)"/>
    <text class="mut elabel" x="655" y="212" fill="#f0a93b">if ambiguous</text>
  </g>

  <!-- ===== Three concurrent lanes ===== -->
  <text class="sec" x="40" y="300">TEXTBOOK RETRIEVAL  &#183;  neuro_core._retrieve  (no generative LLM)</text>
  <text class="sec" x="520" y="300">FIGURE LANE  (no query-time LLM)</text>
  <text class="sec" x="940" y="300">LITERATURE LANE  &#183;  PubMed (concurrent)</text>

  <!-- Lane 1: textbook retrieval -->
  <g>
    <rect class="model" x="40" y="316" width="300" height="44" rx="8"/>
    <text class="modelT" x="190" y="343">BGE-large-en-v1.5 &#8212; embed query</text>

    <rect class="node" x="40" y="378" width="300" height="44" rx="8"/>
    <text class="nodeT" x="190" y="400">LanceDB hybrid &#183; vector kNN + FTS</text>
    <text class="nodeS" x="190" y="415">reciprocal-rank fusion (k=60)</text>

    <rect class="model" x="40" y="440" width="300" height="44" rx="8"/>
    <text class="modelT" x="190" y="462">bge-reranker-v2-m3 &#8212; rerank &#8594; top 12</text>

    <ellipse cx="315" cy="478" rx="45" ry="7" fill="#27314a" stroke="#46557a"/>
    <path d="M270,478 v20 a45,7 0 0 0 90,0 v-20" fill="none" stroke="#46557a"/>
    <text class="nodeS" x="315" y="497">chunks.lance</text>

    <line class="edge" x1="190" y1="360" x2="190" y2="376" marker-end="url(#arrow)"/>
    <line class="edge" x1="190" y1="422" x2="190" y2="438" marker-end="url(#arrow)"/>
    <line class="edge" x1="270" y1="486" x2="232" y2="430" marker-end="url(#arrow)"/>
  </g>

  <!-- Lane 2: figures -->
  <g>
    <rect class="node" x="460" y="316" width="320" height="44" rx="8"/>
    <text class="nodeT" x="620" y="338">figure_retriever  (_collect_figures)</text>
    <text class="nodeS" x="620" y="353">neuro_core.query / figure_retriever</text>

    <rect class="node" x="460" y="378" width="152" height="48" rx="8"/>
    <text class="nodeT" x="536" y="398" font-size="12">caption-lexical IDF*</text>
    <text class="nodeS" x="536" y="414" font-size="10.5">prefers rewritten captions</text>

    <rect class="model" x="628" y="378" width="152" height="48" rx="8"/>
    <text class="modelT" x="704" y="398" font-size="12">BiomedCLIP</text>
    <text class="nodeS" x="704" y="414" font-size="10.5" fill="#9fd9d1">image-embed (semantic)</text>

    <rect class="det" x="460" y="444" width="320" height="42" rx="8"/>
    <text class="nodeT" x="620" y="470">figure_guards &#8212; region / level / anatomy filter</text>

    <ellipse cx="620" cy="503" rx="45" ry="7" fill="#27314a" stroke="#46557a"/>
    <path d="M575,503 v20 a45,7 0 0 0 90,0 v-20" fill="none" stroke="#46557a"/>
    <text class="nodeS" x="620" y="520">figures.lance</text>

    <line class="edge" x1="560" y1="360" x2="540" y2="376" marker-end="url(#arrow)"/>
    <line class="edge" x1="680" y1="360" x2="700" y2="376" marker-end="url(#arrow)"/>
    <line class="edge" x1="536" y1="426" x2="560" y2="442" marker-end="url(#arrow)"/>
    <line class="edge" x1="704" y1="426" x2="680" y2="442" marker-end="url(#arrow)"/>
    <text class="mut" x="620" y="440" font-size="10" text-anchor="middle">RRF</text>
  </g>

  <!-- Lane 3: literature + LLM 2 -->
  <g>
    <rect class="node" x="900" y="316" width="300" height="44" rx="8"/>
    <text class="nodeT" x="1050" y="338">PubMed E-utilities fan-out</text>
    <text class="nodeS" x="1050" y="353">literature/ &#183; httpx</text>

    <rect class="node" x="900" y="378" width="300" height="44" rx="8"/>
    <text class="nodeT" x="1050" y="400">rank: relevance / tier / recency</text>
    <text class="nodeS" x="1050" y="415">+ quality floor &#183; TTL cache</text>

    <rect class="llm" x="900" y="440" width="300" height="70" rx="10"/>
    <text class="llmT" x="1050" y="462" font-size="13.5">&#9313;  LLM &#8212; LITERATURE SYNTHESIS</text>
    <text class="llmS" x="1050" y="481" font-size="12.5" font-weight="600">glm-5.2 &#183; OpenRouter &#183; text</text>
    <text class="llmS" x="1050" y="499" font-size="11.5">synthesize_literature &#8594; [L#] paragraph</text>

    <ellipse cx="1240" cy="338" rx="42" ry="7" fill="#27314a" stroke="#46557a"/>
    <path d="M1198,338 v20 a42,7 0 0 0 84,0 v-20" fill="none" stroke="#46557a"/>
    <text class="nodeS" x="1240" y="355" font-size="10.5">NCBI (ext)</text>

    <line class="edge" x1="1050" y1="360" x2="1050" y2="376" marker-end="url(#arrow)"/>
    <line class="edge" x1="1050" y1="422" x2="1050" y2="438" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Woven synthesis LLM 3 (wide, fan-in) ===== -->
  <g>
    <rect class="llm" x="40" y="596" width="1160" height="86" rx="12"/>
    <text class="llmT" x="620" y="624" font-size="16">&#9314;  LLM &#8212; WOVEN SYNTHESIS</text>
    <text class="llmS" x="620" y="646" font-size="13" font-weight="600">glm-5.2 &#183; OpenRouter &#183; woven_synth.synthesize_woven</text>
    <text class="llmS" x="620" y="666" font-size="12.5">merges top textbook chunks [n] + literature [L#] (+ figure images&#8224;) &#8594; one cited answer</text>

    <!-- fan-in arrows -->
    <line class="edgeRed" x1="190" y1="510" x2="190" y2="594" marker-end="url(#arrow)"/>
    <text class="elabel" x="196" y="556" fill="#ff8a8a">[n] top chunks</text>

    <line class="edgeTealD" x1="620" y1="527" x2="620" y2="594" marker-end="url(#arrowTeal)"/>
    <text class="elabel" x="628" y="556" fill="#34d399">figure plates + images&#8224;</text>

    <line class="edgeTeal" x1="1050" y1="510" x2="1050" y2="594" marker-end="url(#arrowTeal)"/>
    <text class="elabel" x="1058" y="556" fill="#34d399">[L#]</text>
  </g>

  <!-- figure-image multimodal note -->
  <rect x="40" y="700" width="1160" height="40" rx="8" fill="#10182b" stroke="#2b3650"/>
  <text x="58" y="718" class="lbl" font-size="12"><tspan fill="#34d399" font-weight="700">&#8224; figure images:</tspan> sent to a <tspan font-weight="700">multimodal</tspan> synth (Vertex Gemini). glm-5.2 is <tspan font-weight="700">text-only</tspan> &#8594; images are dropped and the call is retried text-only</text>
  <text x="58" y="733" class="mut" font-size="12">(PR #85). Figure <tspan fill="#e8eef9" font-weight="700">captions</tspan> always travel as text in the prompt, so citations &amp; figure references are unaffected by the provider.</text>

  <!-- ===== Verify ===== -->
  <g>
    <rect class="det" x="300" y="760" width="600" height="54" rx="9"/>
    <text class="nodeT" x="600" y="783">answer_verify &#183; entailment.should_cite</text>
    <text class="nodeS" x="600" y="800">LexicalVerifier (deterministic) &#8212; NLI only if CASEBOARD_NLI_MODEL &#183; withhold weak cites, never fabricate</text>
    <line class="edge" x1="600" y1="682" x2="600" y2="758" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Output ===== -->
  <g>
    <rect class="node" x="300" y="838" width="600" height="46" rx="9" stroke="#46557a"/>
    <text class="nodeT" x="600" y="860">Cited answer + figures &#8594; SPA renders</text>
    <text class="nodeS" x="600" y="876">[n] textbook &#183; [L#] PubMed &#183; figure gallery &#183; groundedness</text>
    <line class="edge" x1="600" y1="814" x2="600" y2="836" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Legend / summary ===== -->
  <rect x="40" y="912" width="1420" height="248" rx="12" fill="#10182b" stroke="#2b3650"/>
  <text x="62" y="940" class="lbl" font-size="15" font-weight="700">LLM calls in one Ask request</text>

  <rect class="llm" x="62" y="954" width="26" height="20" rx="5"/><text x="75" y="969" class="llmT" font-size="12">&#9312;</text>
  <text x="98" y="969" class="lbl" font-size="12.5"><tspan font-weight="700">Disambiguation</tspan> &#8212; gemini-3.1-flash-lite (OpenRouter) &#183; text &#183; <tspan fill="#f6b73c">conditional</tspan> (only if ambiguity_gate trips; most clear questions skip it)</text>
  <rect class="llm" x="62" y="982" width="26" height="20" rx="5"/><text x="75" y="997" class="llmT" font-size="12">&#9313;</text>
  <text x="98" y="997" class="lbl" font-size="12.5"><tspan font-weight="700">Literature synthesis</tspan> &#8212; glm-5.2 (OpenRouter) &#183; text &#183; turns ranked PubMed abstracts into the [L#] paragraph</text>
  <rect class="llm" x="62" y="1010" width="26" height="20" rx="5"/><text x="75" y="1025" class="llmT" font-size="12">&#9314;</text>
  <text x="98" y="1025" class="lbl" font-size="12.5"><tspan font-weight="700">Woven synthesis</tspan> &#8212; glm-5.2 (OpenRouter) &#183; text (+ figure images on a multimodal provider) &#183; produces the single [n]+[L#] answer</text>

  <text x="62" y="1062" class="mut" font-size="12.5"><tspan fill="#2dd4bf" font-weight="700">ML model inference (NOT a generative LLM):</tspan>  BGE-large (text embed) &#183; bge-reranker-v2-m3 &#183; BiomedCLIP (figure embed)</text>
  <text x="62" y="1084" class="mut" font-size="12.5"><tspan fill="#e8eef9" font-weight="700">Offline / index-build LLM (not in the Ask request):</tspan>  Gemini figure recaptioning (recaption_figures) &#8212; consumed at query time only as cached text</text>
  <text x="62" y="1106" class="mut" font-size="12.5"><tspan fill="#c3cde0" font-weight="700">Deterministic, no model:</tspan>  ambiguity_gate &#183; RRF fusion &#183; figure_guards &#183; entailment LexicalVerifier</text>

  <!-- color key -->
  <rect class="llm" x="62" y="1124" width="20" height="14" rx="4"/><text x="90" y="1135" class="mut" font-size="11.5">generative LLM call</text>
  <rect class="model" x="240" y="1124" width="20" height="14" rx="4"/><text x="268" y="1135" class="mut" font-size="11.5">ML model inference</text>
  <rect class="det" x="430" y="1124" width="20" height="14" rx="4"/><text x="458" y="1135" class="mut" font-size="11.5">deterministic step</text>
  <ellipse cx="620" cy="1131" rx="14" ry="6" fill="#27314a" stroke="#46557a"/><text x="646" y="1135" class="mut" font-size="11.5">data store</text>
  <line class="edgeRed" x1="760" y1="1131" x2="800" y2="1131"/><text x="808" y="1135" class="mut" font-size="11.5">textbook [n]</text>
  <line class="edgeTeal" x1="910" y1="1131" x2="950" y2="1131"/><text x="958" y="1135" class="mut" font-size="11.5">literature [L#]</text>
  <line class="edgeTealD" x1="1070" y1="1131" x2="1110" y2="1131"/><text x="1118" y="1135" class="mut" font-size="11.5">figure images (dashed = dropped on glm)</text>

  <text x="1440" y="1150" class="mut" font-size="10.5" text-anchor="end">* captions Gemini-rewritten offline at index build</text>
</svg>
